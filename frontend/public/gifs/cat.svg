<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <style>
    .eyelid { transform-box: fill-box; transform-origin: center; animation: blink 3.2s ease-in-out infinite; }
    .tail { transform-origin: 88px 96px; animation: swish 1.1s ease-in-out infinite alternate; }
    @keyframes blink { 0%, 86%, 100% { transform: scaleY(1); } 91% { transform: scaleY(.12); } }
    @keyframes swish { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
  </style>
