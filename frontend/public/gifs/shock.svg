<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <style>
    .pop { transform-box: fill-box; transform-origin: center; animation: jolt .9s cubic-bezier(.3, 1.6, .4, 1) infinite; }
    .p2 { animation-delay: .15s; }
    .p3 { animation-delay: .3s; }
    @keyframes jolt {
      0%, 100% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.22); opacity: 1; }
      70% { transform: scale(1); opacity: .85; }
    }
  </style>
  <g class="pop">
    <rect x="54" y="14" width="12" height="48" rx="6" fill="#fbbf24" />
    <circle cx="60" cy="80" r="7.5" fill="#fbbf24" />
  </g>
  <g class="pop p2">
    <rect x="20" y="34" width="9" height="34" rx="4.5" fill="#60a5fa" />
    <circle cx="24.5" cy="84" r="5.5" fill="#60a5fa" />
  </g>
  <g class="pop p3">
    <rect x="91" y="34" width="9" height="34" rx="4.5" fill="#f472b6" />
    <circle cx="95.5" cy="84" r="5.5" fill="#f472b6" />
  </g>
</svg>
